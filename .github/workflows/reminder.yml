name: Google Classroom reminders

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      PURELYMAIL_USER: ${{ secrets.PURELYMAIL_USER }}
      PURELYMAIL_PASS: ${{ secrets.PURELYMAIL_PASS }}
      PURELYMAIL_TO: ${{ secrets.PURELYMAIL_TO }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Write Google OAuth credentials
        shell: bash
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" | base64 --decode > credentials.json

      - name: Run reminders
        run: python reminder.py
